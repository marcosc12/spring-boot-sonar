<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proveedores</title>
</head>
<body>
<!-- S (Responsabilidad Única, Single Responsibility): esta plantilla solo presenta registros
     y formularios de proveedores; la consulta y persistencia corresponden al controlador MVC
     y al servicio. -->
<nav aria-label="Módulos">
    <a th:href="@{/employees}">Empleados</a>
    <a th:href="@{/providers}">Proveedores</a>
    <a th:href="@{/products}">Productos</a>
    <a th:href="@{/expenses}">Gastos</a>
    <a th:href="@{/incomes}">Ingresos</a>
    <a th:href="@{/bank-accounts}">Cuentas bancarias</a>
</nav>
<main>
    <h1>Proveedores</h1>
    <form th:action="@{/providers}" th:object="${form}" method="post">
        <input type="hidden" th:field="*{id}">
        <label for="name">Nombre</label><input id="name" th:field="*{name}" required>
        <label for="taxId">Identificación fiscal</label><input id="taxId" th:field="*{taxId}">
        <label for="email">Correo</label><input id="email" type="email" th:field="*{email}">
        <label for="phone">Teléfono</label><input id="phone" th:field="*{phone}">
        <button type="submit">Guardar proveedor</button>
    </form>
    <table>
        <thead><tr><th>Nombre</th><th>Identificación fiscal</th><th>Correo</th><th>Teléfono</th><th>Acciones</th></tr></thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.name}"></td><td th:text="${item.taxId}"></td>
            <td th:text="${item.email}"></td><td th:text="${item.phone}"></td>
            <td>
                <a th:href="@{/providers/{id}/edit(id=${item.id})}">Editar</a>
                <form th:action="@{/providers/{id}/delete(id=${item.id})}" method="post"><button type="submit">Eliminar</button></form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(items)}"><td colspan="5">No hay proveedores registrados.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
