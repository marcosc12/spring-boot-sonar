<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cuentas bancarias</title>
</head>
<body>
<!-- S (Responsabilidad Única, Single Responsibility): esta plantilla solo presenta cuentas
     bancarias y formularios; las reglas de cuentas y la persistencia se resuelven fuera de la vista. -->
<nav aria-label="Módulos">
    <a th:href="@{/employees}">Empleados</a>
    <a th:href="@{/providers}">Proveedores</a>
    <a th:href="@{/products}">Productos</a>
    <a th:href="@{/expenses}">Gastos</a>
    <a th:href="@{/incomes}">Ingresos</a>
    <a th:href="@{/bank-accounts}">Cuentas bancarias</a>
</nav>
<main>
    <h1>Cuentas bancarias</h1>
    <form th:action="@{/bank-accounts}" th:object="${form}" method="post">
        <input type="hidden" th:field="*{id}">
        <label for="bankName">Banco</label><input id="bankName" th:field="*{bankName}" required>
        <label for="accountName">Titular</label><input id="accountName" th:field="*{accountName}" required>
        <label for="accountNumber">Número de cuenta</label><input id="accountNumber" th:field="*{accountNumber}" required>
        <label for="currency">Moneda</label><input id="currency" th:field="*{currency}" required>
        <label for="balance">Saldo inicial</label><input id="balance" type="number" step="0.01" th:field="*{balance}" required>
        <button type="submit">Guardar cuenta</button>
    </form>
    <table>
        <thead><tr><th>Banco</th><th>Titular</th><th>Número de cuenta</th><th>Moneda</th><th>Saldo</th><th>Acciones</th></tr></thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.bankName}"></td><td th:text="${item.accountName}"></td>
            <td th:text="${item.accountNumber}"></td><td th:text="${item.currency}"></td><td th:text="${item.balance}"></td>
            <td>
                <a th:href="@{/bank-accounts/{id}/edit(id=${item.id})}">Editar</a>
                <form th:action="@{/bank-accounts/{id}/delete(id=${item.id})}" method="post"><button type="submit">Eliminar</button></form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(items)}"><td colspan="6">No hay cuentas bancarias registradas.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
