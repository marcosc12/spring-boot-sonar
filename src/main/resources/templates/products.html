<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Productos</title>
</head>
<body>
<!-- S (Responsabilidad Única, Single Responsibility): esta plantilla solo presenta productos
     y existencias; las reglas de inventario y la persistencia se resuelven fuera de la vista. -->
<nav aria-label="Módulos">
    <a th:href="@{/employees}">Empleados</a>
    <a th:href="@{/providers}">Proveedores</a>
    <a th:href="@{/products}">Productos</a>
    <a th:href="@{/expenses}">Gastos</a>
    <a th:href="@{/incomes}">Ingresos</a>
    <a th:href="@{/bank-accounts}">Cuentas bancarias</a>
</nav>
<main>
    <h1>Productos e inventario</h1>
    <form th:action="@{/products}" th:object="${form}" method="post">
        <input type="hidden" th:field="*{id}">
        <label for="name">Nombre</label><input id="name" th:field="*{name}" required>
        <label for="sku">SKU</label><input id="sku" th:field="*{sku}" required>
        <label for="description">Descripción</label><input id="description" th:field="*{description}">
        <label for="unitPrice">Precio unitario</label><input id="unitPrice" type="number" min="0" step="0.01" th:field="*{unitPrice}" required>
        <label for="stockQuantity">Existencias</label><input id="stockQuantity" type="number" min="0" th:field="*{stockQuantity}" required>
        <label for="providerName">Proveedor</label><input id="providerName" th:field="*{providerName}">
        <button type="submit">Guardar producto</button>
    </form>
    <table>
        <thead><tr><th>Producto</th><th>SKU</th><th>Descripción</th><th>Precio</th><th>Existencias</th><th>Proveedor</th><th>Acciones</th></tr></thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.name}"></td><td th:text="${item.sku}"></td><td th:text="${item.description}"></td>
            <td th:text="${item.unitPrice}"></td><td th:text="${item.stockQuantity}"></td><td th:text="${item.providerName}"></td>
            <td>
                <a th:href="@{/products/{id}/edit(id=${item.id})}">Editar</a>
                <form th:action="@{/products/{id}/delete(id=${item.id})}" method="post"><button type="submit">Eliminar</button></form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(items)}"><td colspan="7">No hay productos registrados.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
