<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingresos</title>
</head>
<body>
<!-- S (Responsabilidad Única, Single Responsibility): esta plantilla solo presenta ingresos
     y formularios; las reglas financieras y la persistencia se resuelven fuera de la vista. -->
<nav aria-label="Módulos">
    <a th:href="@{/employees}">Empleados</a>
    <a th:href="@{/providers}">Proveedores</a>
    <a th:href="@{/products}">Productos</a>
    <a th:href="@{/expenses}">Gastos</a>
    <a th:href="@{/incomes}">Ingresos</a>
    <a th:href="@{/bank-accounts}">Cuentas bancarias</a>
</nav>
<main>
    <h1>Ingresos</h1>
    <form th:action="@{/incomes}" th:object="${form}" method="post">
        <input type="hidden" th:field="*{id}">
        <label for="description">Descripción</label><input id="description" th:field="*{description}" required>
        <label for="category">Categoría</label><input id="category" th:field="*{category}" required>
        <label for="amount">Importe</label><input id="amount" type="number" min="0" step="0.01" th:field="*{amount}" required>
        <label for="receivedOn">Fecha</label><input id="receivedOn" type="date" th:field="*{receivedOn}" required>
        <label for="bankAccount">Cuenta bancaria</label><input id="bankAccount" th:field="*{bankAccount}">
        <button type="submit">Registrar ingreso</button>
    </form>
    <table>
        <thead><tr><th>Descripción</th><th>Categoría</th><th>Importe</th><th>Fecha</th><th>Cuenta</th><th>Acciones</th></tr></thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.description}"></td><td th:text="${item.category}"></td><td th:text="${item.amount}"></td>
            <td th:text="${item.receivedOn}"></td><td th:text="${item.bankAccount}"></td>
            <td>
                <a th:href="@{/incomes/{id}/edit(id=${item.id})}">Editar</a>
                <form th:action="@{/incomes/{id}/delete(id=${item.id})}" method="post"><button type="submit">Eliminar</button></form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(items)}"><td colspan="6">No hay ingresos registrados.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
